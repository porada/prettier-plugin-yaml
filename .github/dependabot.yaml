version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 1

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    versioning-strategy: increase
    groups:
      vite-plus:
        patterns:
          - '@vitest/coverage-v8'
          - vite-plus
    cooldown:
      default-days: 1
      exclude:
        - '@prettier/*'
        - '@standard-config/*'
        - prettier
