autoDedupe: true

autoInstallPeers: false

color: always

gitChecks: false

lockfile:
  includeResolutionSettings: true

minimumReleaseAgeExclude:
  - '@prettier/*'
  - '@standard-config/*'
  - prettier

overrides:
  prettier-plugin-yaml: link:.
  vite-plus>oxfmt: '-'
  vite-plus>oxlint: latest
  vite-plus>tsrs: latest

peerDependencyRules:
  allowAny:
    - typescript
  ignoreMissing:
    - eslint
    - vitest

strictPeerDependencies: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - tsrs
